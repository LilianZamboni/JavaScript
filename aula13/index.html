<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios de string</title>
</head>
<body>
    <script>
        const nome = prompt('Digite seu nome completo:');
        document.body.innerHTML += `O seu nome é: ${nome} <br />`;
        document.body.innerHTML += `Seu nome tem ${nome.length} letras. <br />`;
        document.body.innerHTML += `A segunda letra do seu nome é: ${nome.charAt(1)} <br />`;
        document.body.innerHTML += `Qual o primeiro indice da letra L no seu nome? ${nome.indexOf('l')}<br />`;
        document.body.innerHTML += `Qual o último indice da letra L no seu nome? ${nome.lastIndexOf('l')}<br />`;
        document.body.innerHTML += `As últimas 3 letras do seu nome são: ${nome.slice(-3, nome.length)}<br />`;
        document.body.innerHTML += `As palavras do seu nome são: ${nome.split(' ')}<br />`;
        document.body.innerHTML += `Seu nome com letras minúsculas: ${nome.toLowerCase()}<br />`;
        document.body.innerHTML += `Seu nome com letras maiúsculas: ${nome.toUpperCase()}<br />`;
    </script>
    
</body>
</html>
